[package]
name = "cordn-coordinator-app"
version = "0.5.13-beta.3"
description = "Run a cordn MLS delivery coordinator on Android and Desktop"
authors = ["Cordn contributors"]
license = "MIT"
repository = "https://github.com/toddsmith456/Todd-s-Cordn-Coordinator-"
edition = "2021"
rust-version = "1.88"
default-run = "cordn-coordinator"

[workspace]
resolver = "2"
members = [".", "plugins/cordn-android-service"]

[[bin]]
name = "cordn-coordinator"
path = "src/main.rs"

[lib]
name = "cordn_coordinator_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-cordn-android-service = { path = "plugins/cordn-android-service" }
tauri-plugin-opener = "2"
