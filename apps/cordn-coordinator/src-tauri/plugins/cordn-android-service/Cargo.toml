[package]
name = "tauri-plugin-cordn-android-service"
version = "0.1.0"
authors = ["Cordn contributors"]
description = "Android foreground-service host for cordn"
edition = "2021"
rust-version = "1.88"
license = "MIT"
links = "tauri-plugin-cordn-android-service"

[dependencies]
tauri = { version = "2.11.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
cordn-core = { path = "../../../../../crates/cordn-core" }
cordn-server = { path = "../../../../../crates/cordn-server", features = ["server"] }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing-subscriber = "0.3"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
