name: Release (Android)

# Android lane: triggered by `android-vX.Y.Z` tags (prerelease: hyphenated,
# e.g. `android-v0.6.0-next.1`). Builds, signs, and attaches only the arm64
# APK to its own GitHub Release. The tag semver is the app's versionName —
# the app versioning is independent of the server lane's parity `v*` tags.

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  android:
    name: build (Android arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cordn-coordinator/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Configure signing and version
        env:
          CORDN_KEYSTORE_PATH: ${{ runner.temp }}/cordn-release.keystore
          CORDN_KEYSTORE_BASE64: ${{ secrets.CORDN_KEYSTORE_BASE64 }}
          CORDN_KEYSTORE_PASSWORD: ${{ secrets.CORDN_KEYSTORE_PASSWORD }}
          CORDN_KEY_ALIAS: ${{ secrets.CORDN_KEY_ALIAS }}
          CORDN_KEY_PASSWORD: ${{ secrets.CORDN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in CORDN_KEYSTORE_BASE64 CORDN_KEYSTORE_PASSWORD CORDN_KEY_ALIAS CORDN_KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "missing GitHub secret: $value" >&2; exit 1; }
          done
          printf '%s' "$CORDN_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$CORDN_KEYSTORE_PATH"
          test -s "$CORDN_KEYSTORE_PATH"

          version="${GITHUB_REF_NAME#android-v}"
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          # ponytail: reserve 10,000 workflow runs per app version; widen only if that ever becomes real.
          # Must stay above the old combined-lane codes (first lane tag: android-v0.5.2 > v0.5.1-next.3).
          version_code=$((major * 100000000 + minor * 1000000 + patch * 10000 + GITHUB_RUN_NUMBER % 10000))
          echo "CORDN_ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "CORDN_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - working-directory: apps/cordn-coordinator
        run: pnpm install --frozen-lockfile
      - name: Build signed APK
        working-directory: apps/cordn-coordinator
        env:
          CORDN_KEYSTORE_PATH: ${{ runner.temp }}/cordn-release.keystore
          CORDN_KEYSTORE_PASSWORD: ${{ secrets.CORDN_KEYSTORE_PASSWORD }}
          CORDN_KEY_ALIAS: ${{ secrets.CORDN_KEY_ALIAS }}
          CORDN_KEY_PASSWORD: ${{ secrets.CORDN_KEY_PASSWORD }}
        run: pnpm exec tauri android build --apk --target aarch64 --ci
      - name: Verify and package APK
        working-directory: apps/cordn-coordinator
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$apk"
          output="cordn-coordinator-${GITHUB_REF_NAME}-android-arm64.apk"
          cp "$apk" "$output"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          details="$("$signer" verify --verbose --print-certs "$output")"
          printf '%s\n' "$details"
          actual="$(printf '%s\n' "$details" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2}')"
          expected="a6626cfca551c5605f0af450c6bf6d831fc70eb2dcd17f027eb358c56852758f"
          test "$actual" = "$expected" || { echo "APK was not signed by the Cordn release key" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cordn-coordinator-android-arm64
          path: apps/cordn-coordinator/cordn-coordinator-*-android-arm64.apk

  release:
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.apk > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS
