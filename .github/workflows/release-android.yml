name: Release (Android)

# Android lane: triggered by `android-vX.Y.Z` tags (prerelease: hyphenated,
# e.g. `android-v0.6.0-next.1`). Builds, signs, and attaches only the arm64
# APK to its own GitHub Release. The tag semver is the app's versionName —
# the app versioning is independent of the server lane's parity `v*` tags.

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  android:
    name: build (Android arm64 APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cordn-coordinator/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK components
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Configure signing key
        env:
          CORDN_SIGNING_BUNDLE: ${{ secrets.CORDN_SIGNING_BUNDLE }}
        shell: python
        run: |
          import base64, json, os
          from pathlib import Path
          raw = os.environ.get("CORDN_SIGNING_BUNDLE", "")
          if not raw:
              print("::error::Missing repository secret CORDN_SIGNING_BUNDLE. Add it under Settings > Secrets and variables > Actions.")
              raise SystemExit(1)
          try:
              bundle = json.loads(raw)
          except json.JSONDecodeError:
              print("::error::CORDN_SIGNING_BUNDLE is not valid JSON. Paste the entire contents of CORDN_SIGNING_BUNDLE.txt, not its filename or the ZIP file.")
              raise SystemExit(1)
          required = {"keystore_base64", "store_password", "key_alias", "key_password"}
          if not isinstance(bundle, dict) or not required.issubset(bundle):
              print("::error::CORDN_SIGNING_BUNDLE is missing required signing fields. Paste the entire original text file.")
              raise SystemExit(1)
          path = Path(os.environ["RUNNER_TEMP"]) / "todd-cordn-release.p12"
          path.write_bytes(base64.b64decode(bundle["keystore_base64"], validate=True))
          path.chmod(0o600)
          values = {
              "CORDN_KEYSTORE_PATH": str(path),
              "CORDN_KEYSTORE_PASSWORD": bundle["store_password"],
              "CORDN_KEY_ALIAS": bundle["key_alias"],
              "CORDN_KEY_PASSWORD": bundle["key_password"],
          }
          with open(os.environ["GITHUB_ENV"], "a") as out:
              for name, value in values.items():
                  if not value or "\n" in value or "\r" in value:
                      raise SystemExit("Invalid signing bundle field: " + name)
                  print("::add-mask::" + value)
                  out.write(name + "=" + value + "\n")
      - name: Configure version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#android-v}"
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          # ponytail: reserve 10,000 workflow runs per app version; widen only if that ever becomes real.
          # Must stay above the old combined-lane codes (first lane tag: android-v0.5.2 > v0.5.1-next.3).
          version_code=$((major * 100000000 + minor * 1000000 + patch * 10000 + GITHUB_RUN_NUMBER % 10000))
          echo "CORDN_ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "CORDN_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - working-directory: apps/cordn-coordinator
        run: pnpm install --frozen-lockfile
      - name: Build signed APK
        working-directory: apps/cordn-coordinator
        run: |
          set -o pipefail
          pnpm exec tauri android build --apk --target aarch64 --ci 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report build failure diagnostics
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "android-build.log"
          if log.exists():
              for line in log.read_text(errors="replace").splitlines()[-60:]:
                  escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Android build diagnostic::" + escaped)

      - name: Verify and package APK
        working-directory: apps/cordn-coordinator
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$apk"
          output="cordn-coordinator-${GITHUB_REF_NAME}-android-arm64.apk"
          cp "$apk" "$output"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          details="$("$signer" verify --verbose --print-certs "$output")"
          printf '%s\n' "$details"
          package="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$output" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$package" = "com.toddsmith456.cordn.coordinator" || { echo "Unexpected APK package: $package" >&2; exit 1; }
          actual="$(printf '%s\n' "$details" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2}')"
          expected="80f84f7d629664ebeca758e31b8a1e712c10d89f6efebec4dca2bb37ef0997d2"
          test "$actual" = "$expected" || { echo "APK was not signed by the Todd fork release key" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cordn-coordinator-android-arm64
          path: apps/cordn-coordinator/cordn-coordinator-*-android-arm64.apk

  release:
    needs: [android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prerelease flag (hyphen in the semver part, not the android-v prefix)
        id: pre
        run: |
          v="${GITHUB_REF_NAME#android-v}"
          if [[ "$v" == *"-"* ]]; then echo "flag=true" >> "$GITHUB_OUTPUT"; else echo "flag=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.apk > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.pre.outputs.flag }}
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS
