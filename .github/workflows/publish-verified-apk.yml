name: Publish verified Android APK

on:
  push:
    branches: [master]
    paths: ['.github/workflows/publish-verified-apk.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cordn-coordinator-android-arm64
          path: artifacts
          run-id: 42128598652
          github-token: ${{ github.token }}
      - name: Publish existing verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, sys, urllib.request, urllib.error, urllib.parse
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          api = 'https://api.github.com/repos/' + repo
          tag = 'android-v0.5.2-todd.4'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'Todd-Cordn-release', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(url, data=None, content_type='application/json'):
              h = dict(headers)
              h['Content-Type'] = content_type
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=h), timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as e:
                  message = e.read().decode(errors='replace')
                  print('::error::GitHub release API HTTP ' + str(e.code) + ': ' + message.replace('\n', ' ').replace('\r', ' '))
                  raise SystemExit(1)
          folder = Path('artifacts')
          apks = sorted(folder.glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected exactly one verified APK')
          checksums = ''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in apks)
          (folder / 'SHA256SUMS').write_text(checksums)
          releases = request(api + '/releases')
          release = next((r for r in releases if r['tag_name'] == tag), None)
          if release is None:
              release = request(api + '/releases', json.dumps({'tag_name': tag, 'name': 'Todd’s Cordn Coordinator 0.5.2 — side-by-side install', 'body': 'Signed arm64 APK of the Cordn Coordinator fork. Separate Android application ID: `com.toddsmith456.cordn.coordinator`. Original app name, icon, UI, and coordinator behavior are unchanged. Installs alongside the original app with separate storage.\n\nSigning-certificate SHA-256: `80f84f7d629664ebeca758e31b8a1e712c10d89f6efebec4dca2bb37ef0997d2`.\n\nBuilt and verified in Actions run 42128598652. Includes SHA256SUMS.', 'draft': False, 'prerelease': True}).encode())
          uploaded = {a['name'] for a in release.get('assets', [])}
          for path in apks + [folder / 'SHA256SUMS']:
              if path.name in uploaded:
                  continue
              upload = release['upload_url'].split('{')[0] + '?name=' + urllib.parse.quote(path.name)
              request(upload, path.read_bytes(), 'application/vnd.android.package-archive' if path.suffix == '.apk' else 'text/plain')
          print('Published:', release['html_url'])
