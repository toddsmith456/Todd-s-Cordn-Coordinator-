name: Release

# Triggered by a `v*` tag (pushed by `make patch|minor|major`). Builds the
# server archives, signed Android APK, checksums, and multi-arch container.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --features server --target ${{ matrix.target }} -p cordn-server
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cordn-server-${{ matrix.target }}.tar.gz cordn-server
      - uses: actions/upload-artifact@v4
        with:
          name: cordn-server-${{ matrix.target }}
          path: cordn-server-${{ matrix.target }}.tar.gz

  android:
    name: build (Android arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cordn-coordinator/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Configure signing and version
        env:
          CORDN_KEYSTORE_PATH: ${{ runner.temp }}/cordn-release.keystore
          CORDN_KEYSTORE_BASE64: ${{ secrets.CORDN_KEYSTORE_BASE64 }}
          CORDN_KEYSTORE_PASSWORD: ${{ secrets.CORDN_KEYSTORE_PASSWORD }}
          CORDN_KEY_ALIAS: ${{ secrets.CORDN_KEY_ALIAS }}
          CORDN_KEY_PASSWORD: ${{ secrets.CORDN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in CORDN_KEYSTORE_BASE64 CORDN_KEYSTORE_PASSWORD CORDN_KEY_ALIAS CORDN_KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "missing GitHub secret: $value" >&2; exit 1; }
          done
          printf '%s' "$CORDN_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$CORDN_KEYSTORE_PATH"
          test -s "$CORDN_KEYSTORE_PATH"

          version="${GITHUB_REF_NAME#v}"
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          # ponytail: reserve 10,000 workflow runs per parity version; widen only if that ever becomes real.
          version_code=$((major * 100000000 + minor * 1000000 + patch * 10000 + GITHUB_RUN_NUMBER % 10000))
          echo "CORDN_ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "CORDN_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - working-directory: apps/cordn-coordinator
        run: pnpm install --frozen-lockfile
      - name: Build signed APK
        working-directory: apps/cordn-coordinator
        env:
          CORDN_KEYSTORE_PATH: ${{ runner.temp }}/cordn-release.keystore
          CORDN_KEYSTORE_PASSWORD: ${{ secrets.CORDN_KEYSTORE_PASSWORD }}
          CORDN_KEY_ALIAS: ${{ secrets.CORDN_KEY_ALIAS }}
          CORDN_KEY_PASSWORD: ${{ secrets.CORDN_KEY_PASSWORD }}
        run: pnpm exec tauri android build --apk --target aarch64 --ci
      - name: Verify and package APK
        working-directory: apps/cordn-coordinator
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$apk"
          output="cordn-coordinator-${GITHUB_REF_NAME}-android-arm64.apk"
          cp "$apk" "$output"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          details="$("$signer" verify --verbose --print-certs "$output")"
          printf '%s\n' "$details"
          actual="$(printf '%s\n' "$details" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2}')"
          expected="a6626cfca551c5605f0af450c6bf6d831fc70eb2dcd17f027eb358c56852758f"
          test "$actual" = "$expected" || { echo "APK was not signed by the Cordn release key" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cordn-coordinator-android-arm64
          path: apps/cordn-coordinator/cordn-coordinator-*-android-arm64.apk

  # Multi-arch Docker image → GHCR. Independent Rust build (no dependency on
  # the `build` job's release artifacts), so it runs in parallel.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        id: t
        run: |
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          v="${GITHUB_REF_NAME#v}"
          echo "tags=ghcr.io/${repo}/cordn-server:${v},ghcr.io/${repo}/cordn-server:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.t.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.tar.gz *.apk > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.apk
            artifacts/SHA256SUMS
