[package]
name = "cordn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cordn-core = { workspace = true }
base64 = "0.22"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tracing` is a plain (non-optional) dep so the rmcp-free adapter can emit
# abuse-protection rejection logs without the `server` feature.
tracing = "0.1"
# Also plain, for the same reason: the self-description publication loop
# (`announce`) takes a CancellationToken and is unit-tested without the
# `server` feature.
tokio-util = { version = "0.7", features = ["rt"] }

# Server transport + rmcp (Phase B: methods.rs + main.rs). Gated behind the
# `server` feature so the rmcp-free adapter/config compile and test without
# pulling in contextvm-sdk. `contextvm-sdk` injects the caller's Nostr pubkey
# into request extensions (`ctx.extensions.get::<ClientPubkey>()`) and the full
# client-signed request event as `InboundEvent`, and rewrites the rmcp request
# id to the Nostr event id (`ctx.id`).
# Pinned to upstream main c501e01 (mirrored on our vendor/contextvm-sdk branch with
# the contextvm-docs gitlink removed — cargo cannot init that URL-less submodule)
# for the worker-startup MCP handshake fix: a client `notifications/cancelled`
# published while the server was offline (relay-stored, replayed on restart)
# previously hit the fresh rmcp session before `initialize` and killed the
# coordinator.
# ponytail: flip back to a released version (>=0.2.3) once published upstream.
contextvm-sdk = { git = "https://github.com/toddsmith456/Todd-s-Cordn-Coordinator-.git", rev = "a95a543e9555940c0065197b793cb239f321cd2f", optional = true }
rmcp = { version = "1.8", features = ["server", "macros"], optional = true }
schemars = { version = "1", optional = true }
anyhow = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
# NIP-19 nprofile encoding for the startup banner. Already compiled transitively
# (contextvm-sdk → nostr-sdk → nostr at 0.44.x), so this reuses an existing build
# artifact rather than pulling a new one.
nostr = { version = "0.44", optional = true, default-features = false }
# Publishing the coordinator's own kind-0 and kind-10002 events (see `announce`):
# the ContextVM transport publishes them once at startup and cannot retry, so we
# publish them ourselves. Same version and features as contextvm-sdk asks for, so
# this reuses the already-compiled artifact.
nostr-sdk = { version = "0.44", features = ["nip59"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "time", "sync"] }
hex = "0.4"

[features]
default = []
server = ["dep:contextvm-sdk", "dep:rmcp", "dep:schemars", "dep:anyhow", "dep:tracing-subscriber", "dep:nostr", "dep:nostr-sdk", "cordn-core/schemars"]

[[bin]]
name = "cordn-server"
path = "src/main.rs"
required-features = ["server"]
